name: CI

# Pull-request and branch verification runs on the GitHub organization copy
# (.github/workflows/mirror-ci.yml). GitHub Actions deploys main
# (.github/workflows/deploy.yml). Gitea keeps main verification only.
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Task
        uses: arduino/setup-task@v2

      - name: Run tests
        run: task test
